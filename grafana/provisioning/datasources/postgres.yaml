apiVersion: 1

datasources:
  - name: PostgreSQL
    type: grafana-postgresql-datasource
    uid: postgres
    isDefault: true
    access: proxy
    url: postgres:5432
    user: grafana
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      database: health
      sslmode: disable
      postgresVersion: 1800
      timescaledb: false
