[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-health-ingester"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]==3.3.9",
    "gpxpy==1.6.2",
    "lxml==6.1.3",
    "PyYAML==6.0.4",
]

[project.scripts]
apple-health-ingester = "apple_health_ingester.cli:main"

[tool.setuptools_scm]
root = ".."
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apple_health_ingester = ["sql/*.sql"]

[tool.ruff.lint]
# Pinned so new ruff default rules cannot break CI.
select = ["E4", "E7", "E9", "F"]
