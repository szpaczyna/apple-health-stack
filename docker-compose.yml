services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: health
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-health}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init-grafana-user.sh:/docker-entrypoint-initdb.d/init-grafana-user.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-health}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/health/summary.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ingester:
    build: ./ingester
    environment:
      PG_HOST: postgres
      PG_PASS: ${POSTGRES_PASSWORD:-health}
    volumes:
      # Without create_host_path: false, a missing zip becomes an empty directory on the host.
      - type: bind
        source: ${EXPORT_ZIP:-./export.zip}
        target: /app/export.zip
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  grafana-data:
