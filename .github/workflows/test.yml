name: Test

on:
  pull_request:
  # Release calls this via workflow_call, so a push trigger would run tests twice.
  workflow_call:
    inputs:
      ref:
        description: Git ref to test, empty means the event default
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: ingester/pyproject.toml

      - name: Install dependencies
        run: pip install -e ./ingester ruff==0.17.6

      - name: Run unit tests
        run: python -m unittest discover -s ingester/tests -v

      - name: Lint
        run: ruff check ingester
